# Toolbox — nginx site config
# Install:  sudo cp deploy/nginx/toolbox.conf /etc/nginx/sites-available/toolbox.conf
#           sudo cp deploy/nginx/toolbox-security-headers.conf /etc/nginx/snippets/
#           sudo ln -s /etc/nginx/sites-available/toolbox.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Replace every "example.com" with your domain.
#
# Layout on the server:
#   /var/www/toolbox/frontend   ← contents of frontend/dist (the SPA)
#   /var/www/toolbox/uploads    ← local image uploads (used when the Cloudinary toggle is OFF)
#   /var/www/toolbox/backend    ← API source, run by PM2 on 127.0.0.1:5000

upstream toolbox_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Rate-limit zones (per client IP) as a first line of defence; the API has its own Redis limits too.
limit_req_zone $binary_remote_addr zone=toolbox_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=toolbox_auth:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # nginx >= 1.25.1; on older versions use "listen 443 ssl http2;"
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:toolbox_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/toolbox/frontend;
    index index.html;

    # JSON requests are small (the API caps them at 1 MB); upload routes below get larger limits,
    # so other routes can't make nginx spool 90 MB bodies to disk.
    client_max_body_size 2m;
    server_tokens off;
    # Rejected requests get the same status the API uses for its own limits (default would be 503).
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=toolbox_api burst=60 nodelay;
        include /etc/nginx/snippets/toolbox-proxy.conf;
    }

    # Image uploads (storefront, seller, admin and the house store): 10 images × 8 MB, plus multipart overhead.
    location ~ ^/api/v1/(user|vendor|admin|admin/store)/media$ {
        limit_req zone=toolbox_api burst=60 nodelay;
        client_max_body_size 90m;
        include /etc/nginx/snippets/toolbox-proxy.conf;
    }

    # Spreadsheet imports: one file of at most 5 MB.
    location ~ ^/api/v1/(vendor|admin|admin/store)/product-imports$ {
        limit_req zone=toolbox_api burst=60 nodelay;
        client_max_body_size 6m;
        include /etc/nginx/snippets/toolbox-proxy.conf;
    }

    # OTP + login endpoints get a tighter edge limit.
    location ~ ^/api/v1/auth/(otp|admin/login) {
        limit_req zone=toolbox_auth burst=10 nodelay;
        include /etc/nginx/snippets/toolbox-proxy.conf;
    }

    # Razorpay webhooks: no rate limit, raw body passed through untouched.
    location /api/v1/webhooks/ {
        include /etc/nginx/snippets/toolbox-proxy.conf;
    }

    # Health checks for local monitoring only.
    location /health/ {
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://toolbox_api;
    }

    # ── Local uploads (Cloudinary toggle OFF) ──────────────────────────────
    # The API only ever writes re-encoded .webp files here; nginx serves them directly.
    location /uploads/ {
        alias /var/www/toolbox/uploads/;
        access_log off;
        include /etc/nginx/snippets/toolbox-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        location ~* \.(?!webp$)[^.]+$ { return 404; }
    }

    # ── SPA ────────────────────────────────────────────────────────────────
    # Fingerprinted build assets never change, so cache them for a year.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/toolbox-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must always revalidate so a deploy reaches users immediately.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/toolbox-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
